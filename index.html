<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZQ Films – Neue Website</title>
<link rel="canonical" href="https://zqfilms.com/de/">
<script>
(() => {
  let lang='de';
  try { const saved=localStorage.getItem('zqfilms_lang');if(['de','en','zh'].includes(saved))lang=saved; } catch {}
  const aliases={'#approach':'#experience','#why-film':'#values','#contact':'#enquiry'};
  const requested=aliases[location.hash]||location.hash;
  const sections=['#home','#films','#about','#experience','#values','#services','#faq','#enquiry','#impressum','#datenschutz'];
  location.replace('https://zqfilms.com/'+lang+'/'+(sections.includes(requested)?requested:''));
})();
</script>
<meta http-equiv="refresh" content="0; url=https://zqfilms.com/de/">
<style>body{max-width:48rem;margin:12vh auto;padding:24px;font:18px/1.7 system-ui,sans-serif;color:#20211f;background:#f6f3ee}a{color:inherit}nav{display:flex;gap:24px;flex-wrap:wrap}</style>
</head>
<body>
<h1>ZQ Films</h1>
<p>Unsere Website ist umgezogen. / Our website has moved. / 网站已迁至新地址。</p>
<nav aria-label="Sprache / Language / 语言"><a href="https://zqfilms.com/de/" lang="de">Deutsch</a><a href="https://zqfilms.com/en/" lang="en">English</a><a href="https://zqfilms.com/zh/" lang="zh-Hans">中文</a></nav>
</body>
</html>
